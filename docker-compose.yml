services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: transit_satisfaction
      LOG_LEVEL: INFO
    depends_on:
      - mongo

volumes:
  mongo_data:
