name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements-dev.txt

      - run: ruff check src tests
      - run: black --check src tests

      - name: Train demo model (artifact needed for API import-time checks)
        run: PYTHONPATH=src python -m transit_satisfaction.ml.train

      - run: pytest

  terraform-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - run: terraform fmt -check -diff
      - run: terraform init -backend=false
      - run: terraform validate

  build-and-push:
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Train model artifact for image build
        run: |
          pip install -r requirements.txt
          PYTHONPATH=src python -m transit_satisfaction.ml.train

      # Uses OIDC federation instead of long-lived AWS keys in repo secrets.
      - name: Configure AWS credentials
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to ECR
        if: env.AWS_ROLE_ARN != ''
        run: aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Build and push image
        if: env.AWS_ROLE_ARN != ''
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/transit-satisfaction-api:${{ github.sha }} .
          docker push ${{ secrets.ECR_REGISTRY }}/transit-satisfaction-api:${{ github.sha }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
