# Local-testing only. The real deployment (see ../secret.example.yaml)
# expects an external MongoDB (e.g. Atlas) reached via MONGO_URI -- there's
# no in-cluster Mongo in the production manifests on purpose, since a
# database isn't something you want Kubernetes restarting/rescheduling
# alongside the stateless API. This exists purely so the API has something
# to talk to when testing the Deployment/Service/HPA manifests locally on
# Docker Desktop's Kubernetes, without needing a real Mongo or paying for
# anything external.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
