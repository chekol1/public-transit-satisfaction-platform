# Template only -- fill in and apply as `transit-satisfaction-secrets`,
# never commit the filled-in version. In a real At-Bay-style setup this
# would come from AWS Secrets Manager via the External Secrets Operator
# instead of a plain Kubernetes Secret.
apiVersion: v1
kind: Secret
metadata:
  name: transit-satisfaction-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb://<user>:<password>@<host>:27017"
  MONGO_DB_NAME: "transit_satisfaction"
