apiVersion: apps/v1
kind: Deployment
metadata:
  name: transit-satisfaction-api
  labels:
    app: transit-satisfaction-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transit-satisfaction-api
  template:
    metadata:
      labels:
        app: transit-satisfaction-api
    spec:
      containers:
        - name: api
          image: <ECR_REPOSITORY_URL>:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: transit-satisfaction-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
